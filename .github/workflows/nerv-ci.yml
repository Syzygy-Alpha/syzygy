name: NERV CI

on:
  pull_request:
    paths:
      - "nerv/**"
      - ".github/workflows/nerv-ci.yml"
  push:
    branches:
      - main
    paths:
      - "nerv/**"
      - ".github/workflows/nerv-ci.yml"

permissions:
  contents: read

jobs:
  quality:
    name: Tests, lint, and types
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: nerv

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nerv/pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Run lint
        run: python -m ruff check .

      - name: Run type checks
        run: python -m mypy src tests
