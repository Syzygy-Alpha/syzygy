<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0f1716" />
    <title>Página não encontrada — SYZYGY</title>
    <link
      rel="icon"
      href="https://syzygy-alpha.github.io/syzygy/favicon.svg"
      type="image/svg+xml"
    />
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, "Helvetica Neue", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        color: #efe7d8;
        background:
          radial-gradient(circle at 50% 42%, #242745, transparent 32rem),
          #0f1716;
      }
      main {
        width: min(680px, 100%);
        padding: 48px 24px;
        text-align: center;
      }
      span {
        color: #ff735c;
        font-size: 0.7rem;
        font-weight: 800;
        letter-spacing: 0.22em;
      }
      h1 {
        margin: 22px 0;
        font:
          650 clamp(3.5rem, 12vw, 7rem) / 0.9 "Arial Narrow",
          Arial,
          sans-serif;
        letter-spacing: -0.06em;
      }
      p {
        max-width: 520px;
        margin: 0 auto;
        color: rgba(239, 231, 216, 0.68);
        line-height: 1.7;
      }
      nav {
        margin-top: 36px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
      }
      a {
        padding: 14px 20px;
        color: #0f1716;
        background: #b6bcff;
        border: 1px solid #b6bcff;
        text-decoration: none;
        font-size: 0.78rem;
        font-weight: 800;
      }
      a + a {
        color: #efe7d8;
        background: transparent;
        border-color: rgba(239, 231, 216, 0.34);
      }
      a:focus-visible {
        outline: 3px solid currentColor;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <span>ERRO 404 / ÓRBITA NÃO ENCONTRADA</span>
      <h1>Esta página não está no mapa.</h1>
      <p>
        O endereço pode ter mudado ou nunca ter pertencido ao ecossistema
        SYZYGY.
      </p>
      <nav aria-label="Próximos destinos">
        <a href="https://syzygy-alpha.github.io/syzygy/">Voltar ao início</a>
        <a href="https://github.com/Syzygy-Alpha/syzygy"
          >Explorar o repositório</a
        >
      </nav>
    </main>
  </body>
</html>
